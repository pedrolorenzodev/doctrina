<script>(function(){var d=document.documentElement;var t=null;try{t=localStorage.getItem('dz-sitio-theme')}catch(e){}d.dataset.theme=t==='light'||t==='dark'?t:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})()</script>

iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}
</style>
